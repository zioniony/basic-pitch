name: CI
on:
  push:
  pull_request:

jobs:
  test:
    name: test ${{ matrix.py }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        py:
          - "3.12"
          - "3.11"
          - "3.10"
        include:
          - os: macos-latest-xlarge
            py: "3.10"
          - os: macos-latest-xlarge
            py: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.py }}
        run: uv python install ${{ matrix.py }}

      - name: Install soundlibs Ubuntu
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y --fix-missing pkg-config libsndfile1 sox ffmpeg
        if: matrix.os == 'ubuntu-latest'

      - name: Install soundlibs MacOs
        run: brew install libsndfile llvm libomp sox ffmpeg
        if: matrix.os == 'macos-latest-xlarge'

      - name: Install soundlibs Windows
        run: choco install libsndfile sox.portable flac ffmpeg
        if: matrix.os == 'windows-latest'

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      # We will only check this on the minimum python version
      - name: Check formatting, lint and mypy
        run: |
          uv run black basic_pitch tests --line-length 120 --diff --check
          uv run flake8 basic_pitch tests
          uv run mypy basic_pitch tests --strict --ignore-missing-imports --allow-subclassing-any
        if: matrix.py == '3.10'

      - name: Run test suite
        run: uv run pytest tests --ignore tests/test_nn.py --ignore tests/data

      - name: Run full test suite
        run: uv run pytest tests
        if: matrix.py == '3.10'

      - name: Check that basic-pitch can be run as a commandline
        run: uv run basic-pitch --help
