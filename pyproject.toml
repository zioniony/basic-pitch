[project]
name = "basic-pitch"
version = "0.4.0"
description = "Basic Pitch, a lightweight yet powerful audio-to-MIDI converter with pitch bend detection."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Spotify", email = "basic-pitch@spotify.com" },
]
maintainers = [
    { name = "Spotify", email = "basic-pitch@spotify.com" },
]
license = { file = "LICENSE" }
urls = { Homepage = "https://github.com/spotify/basic-pitch" }
keywords = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "coremltools; platform_system == 'Darwin'",
    "librosa>=0.8.0",
    "mir_eval>=0.6.0",
    "numpy>=1.18",
    # Linux: default to ONNX Runtime GPU build (CUDA). Falls back to CPUExecutionProvider
    # automatically when CUDA / GPU drivers are not available on the host.
    "onnxruntime-gpu<1.23; platform_system == 'Linux' and python_version >= '3.10'",
    "onnxruntime; platform_system == 'Windows' and python_version < '3.11'",
    "pretty_midi>=0.2.9",
    "resampy>=0.2.2,<0.4.3",
    "scikit-learn",
    "scipy>=1.4.1",
    "tensorflow>=2.4.1,<2.15.1; platform_system == 'Windows' and python_version >= '3.11'",
    "tensorflow-macos>=2.4.1,<2.15.1; platform_system == 'Darwin' and python_version > '3.11'",
    "typing_extensions",
]

[project.scripts]
basic-pitch = "basic_pitch.predict:main"
bp-download = "basic_pitch.data.download:main"

[project.optional-dependencies]
data = [
    "apache_beam>=2.51.0",
    "mirdata>=1.0.0",
    "smart_open",
    "sox",
    "ffmpeg-python",
]
test = [
    "coverage>=5.0.2",
    "pytest>=6.1.1",
    "pytest-mock",
    "mido",
]
tf = [
    "tensorflow>=2.4.1,<2.15.1; platform_system != 'Darwin'",
    "tensorflow-macos>=2.4.1,<2.15.1; platform_system == 'Darwin' and python_version > '3.7'",
]
coreml = ["coremltools"]
# On Linux we ship the CUDA-enabled ONNX Runtime build; on Windows/macOS
# the CPU `onnxruntime` package is used (Windows GPU is included in it).
onnx = [
    "onnxruntime-gpu<1.23; platform_system == 'Linux'",
	"onnxruntime; platform_system != 'Linux'",
]
docs = ["mkdocs>=1.0.4"]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) – used by `uv sync` for the dev environment.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "basic_pitch[data,test,tf,coreml,onnx,docs]",
    "mypy",
    "black",
    "flake8",
    "check-manifest",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]
namespaces = false

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
exclude = [".venv", ".git", "dist", "*.egg", "build"]
ignore = ["E203", "E731", "W503", "E231"]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
